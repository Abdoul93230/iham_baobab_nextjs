<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
  name="description"
  content="IHAM Baobab"
/>
<link rel="apple-touch-icon" href="%PUBLIC_URL%/logo.png" />
  <title>IHAM Baobab || Page de Paiement</title>

  

  <style>
    :root {
      --primary-color: #4CAF50;
      --hover-color: #45a049;
      --text-color: #333;
      --background-gradient: linear-gradient(135deg, #f5f7fa 0%, #e4e8eb 100%);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--background-gradient);
      color: var(--text-color);
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      line-height: 1.6;
    }

    .payment-container {
      background: rgba(255, 255, 255, 0.95);
      padding: 2.5rem;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 450px;
      text-align: center;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .payment-header {
      margin-bottom: 2rem;
    }

    .payment-header h1 {
      font-size: 1.8rem;
      color: var(--text-color);
      margin-bottom: 0.5rem;
    }

    .payment-description {
      color: #666;
      margin-bottom: 2rem;
      font-size: 1.1rem;
    }

    .ipaymoney-button {
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 1rem 2rem;
      font-size: 1.1rem;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      transition: all 0.3s ease;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .ipaymoney-button:hover {
      background-color: var(--hover-color);
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
    }

    .ipaymoney-button:active {
      transform: translateY(0);
    }

    /* Animation de chargement */
    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.7; }
      100% { opacity: 1; }
    }

    .loading .ipaymoney-button {
      animation: pulse 1.5s infinite;
      pointer-events: none;
    }

    /* Responsive design */
    @media (max-width: 480px) {
      .payment-container {
        margin: 1rem;
        padding: 1.5rem;
      }

      .payment-header h1 {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="payment-container" style="display: none;">
    <div class="payment-header">
      <h1>Finaliser votre paiement</h1>
      <p class="payment-description">
        Cliquez sur le bouton ci-dessous pour procéder au paiement en toute sécurité
      </p>
    </div>
    <div>
      <button
        type="button"
        id="checkout-button"
        class="ipaymoney-button"
        data-environement="live"
        data-key="pk_f83a240bd0df4393b35a819925863e16"
        data-redirect-url="https://www.ihambaobab.com/commandesReference"
        data-cancel-url="https://www.ihambaobab.com/error"
        data-callback-url="https://api.ihambaobab.com/payment_callback2"
        >
        Procéder au paiement
      </button>
    </div>
  </div>
  
  <!-- Socket.IO Client for real-time payment status -->
  <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
  <!-- <script src="./ipaymoney.js"></script> -->
  <script src="./ipaymoney.js"></script>
  <script>
    // data-callback-url="https://secoure.onrender.com/payment_callback2"
    const backendUrl = 'https://api.ihambaobab.com';
    // Récupérer les informations de paiement du localStorage
    const paymentInfo = JSON.parse(localStorage.getItem('paymentInfo'));
    
    if (!paymentInfo) {
      window.location.href = '/';
      throw new Error('Informations de paiement non trouvées');
    }

    // Configurer le bouton iPay
    const button = document.querySelector('.ipaymoney-button');
    const amount = Number(paymentInfo.amount || 0);
    const transactionId = paymentInfo.transactionId;
    button.setAttribute('data-amount', amount);
    button.setAttribute('data-transaction-id', paymentInfo.transactionId);
    console.log({paymentInfo});
    

    // Ajouter un état de chargement lors du clic
    button.addEventListener('click', function() {
      this.parentElement.classList.add('loading');
    });

    const normalizePaymentStatus = (status) => {
      const value = String(status || '').trim().toLowerCase();

      if (["payé", "paye", "paid", "success", "succeeded", "completed", "payé à la livraison", "payé par téléphone"].includes(value)) {
        return 'succeeded';
      }

      if (["échec", "echec", "failed", "cancelled", "canceled", "rejected"].includes(value)) {
        return 'failed';
      }

      return 'pending';
    };

    const clearCheckoutLocalState = () => {
      [
        'panier',
        'orderTotal',
        'orderSubtotal',
        'orderShippingCost',
        'paymentInfo',
        'pendingOrder',
        'orderShippingZone',
        'orderCodeP',
        'paymentInitiated'
      ].forEach((key) => localStorage.removeItem(key));
    };

    const redirectToResult = (status) => {
      if (typeof window.onCloseIpayCheckout === 'function') {
        window.onCloseIpayCheckout();
      }

      if (status === 'succeeded' || status === 'failed') {
        clearCheckoutLocalState();
      }

      window.location.href = `/commandesReference?transactionId=${encodeURIComponent(transactionId)}&status=${encodeURIComponent(status)}&amount=${encodeURIComponent(amount)}`;
    };

    const startOrderStatusPolling = () => {
      let pollTimer = null;
      let wsConnected = false;
      let wsTimedOut = false;
      let paymentResolved = false;

      // ============================================
      // PRIORITÉ 1: WebSocket Real-time (Phase 2) 🚀
      // ============================================
      const connectWebSocket = () => {
        try {
          console.log('🔌 Connecting to WebSocket for real-time payment updates...');
          const socket = io(backendUrl, {
            transports: ['websocket', 'polling'],
            timeout: 10000,
            reconnection: true,
            reconnectionAttempts: 3,
            reconnectionDelay: 1000,
          });

          socket.on('connect', () => {
            console.log('✅ WebSocket Connected!');
            wsConnected = true;
            // Join payment room for this transaction
            socket.emit('payment:join', { reference: transactionId });
            console.log(`📡 Listening for payment status on reference: ${transactionId}`);
          });

          socket.on('payment:status', (event) => {
            if (paymentResolved) return;
            
            console.log('⚡ Payment status received via WebSocket:', event);
            const status = normalizePaymentStatus(event?.statusPayment || event?.status);
            
            if (status === 'succeeded' || status === 'failed') {
              paymentResolved = true;
              console.log(`🎉 Payment ${status} via WebSocket! Redirecting...`);
              
              // Cleanup
              if (pollTimer) clearTimeout(pollTimer);
              socket.emit('payment:leave', { reference: transactionId });
              socket.disconnect();
              
              redirectToResult(status);
            }
          });

          socket.on('disconnect', () => {
            console.log('❌ WebSocket Disconnected');
            wsConnected = false;
            if (!paymentResolved && !wsTimedOut) {
              console.log('⚠️ WebSocket lost, falling back to polling...');
              wsTimedOut = true;
              startPolling(); // Fallback to polling
            }
          });

          socket.on('connect_error', (error) => {
            console.warn('⚠️ WebSocket connection error:', error.message);
          });

          // Timeout après 10s si WebSocket ne se connecte pas
          const wsTimeout = setTimeout(() => {
            if (!wsConnected && !paymentResolved) {
              wsTimedOut = true;
              console.log('⏱️ WebSocket timeout (10s), falling back to polling...');
              socket.close();
              startPolling();
            }
          }, 10000);

          return { socket, wsTimeout };
        } catch (error) {
          console.error('Error connecting to WebSocket:', error);
          wsTimedOut = true;
          startPolling(); // Fallback to polling
          return null;
        }
      };

      // ============================================
      // FALLBACK: Exponential Backoff Polling
      // ============================================
      const startPolling = () => {
        let attempts = 0;
        let nextInterval = 3000;
        let totalTime = 0;
        const maxTime = 10 * 60 * 1000; // 10 minutes

        const getNextInterval = (currentAttempts) => {
          const intervals = [3000, 5000, 8000, 13000, 21000, 34000, 55000];
          return intervals[Math.min(currentAttempts, intervals.length - 1)];
        };

        const poll = async () => {
          attempts += 1;

          try {
            const response = await fetch(`${backendUrl}/getOrderPaymentStatus/${encodeURIComponent(transactionId)}`);

            if (!response.ok) {
              console.warn(`Poll attempt ${attempts}: HTTP ${response.status}`);
              return;
            }

            const data = await response.json();
            const status = normalizePaymentStatus(data?.status);

            console.log(`📊 Poll attempt ${attempts}: ${status} (${totalTime}ms)`);

            if (status === 'succeeded' || status === 'failed') {
              if (paymentResolved) return;
              paymentResolved = true;
              
              console.log(`✅ Payment ${status} via polling! Redirecting...`);
              if (pollTimer) clearTimeout(pollTimer);
              redirectToResult(status);
              return;
            }
          } catch (error) {
            console.error(`Poll attempt ${attempts} error:`, error.message);
          }

          if (totalTime >= maxTime) {
            console.warn('⏱️ Max polling time exceeded (10 minutes)');
            if (pollTimer) clearTimeout(pollTimer);
            clearCheckoutLocalState();
            window.location.href = `/commandesReference?transactionId=${encodeURIComponent(transactionId)}&status=pending&amount=${encodeURIComponent(amount)}`;
            return;
          }

          nextInterval = getNextInterval(attempts - 1);
          console.log(`⏳ Next poll in ${nextInterval / 1000}s (attempt ${attempts + 1})`);

          pollTimer = setTimeout(() => {
            totalTime += nextInterval;
            poll();
          }, nextInterval);
        };

        poll();
      };

      // ============================================
      // LAUNCH: WebSocket first, polling fallback
      // ============================================
      console.log('🚀 Starting payment status monitoring...');
      connectWebSocket();
    };

    startOrderStatusPolling();

    // Nettoyer l'info temporaire immédiatement
    localStorage.removeItem('paymentInfo');
  </script>

<script>
  // Attendre que le DOM soit entièrement chargé
  document.addEventListener("DOMContentLoaded", function() {
      // Sélectionner le bouton par son ID ou une autre méthode
      var button = document.getElementById("checkout-button");

      // Déclencher un clic automatique après un délai
      setTimeout(() => {
          button.click(); // Simule un clic sur le bouton
      }, 500); // 1 seconde de délai avant le clic
  });
</script>

  
</body>
</html>
